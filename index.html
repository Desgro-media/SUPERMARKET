<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NestMart — Everything you need, delivered</title>
  <meta name="description" content="Shop groceries, personal care, shaving and grooming, household, kitchen, electricals and baby essentials online. Fast delivery, easy checkout.">
  <meta name="theme-color" content="#1d4ed8">

  <!-- installable web app (PWA) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="application-name" content="NestMart">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NestMart">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">

  <script>
    /* Apply the saved light/dark theme and colour palette before first paint to avoid a flash. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('freshnest.v1') || '{}'), t = s.theme || 'auto';
        var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        if (s.palette && s.palette !== 'ocean') document.documentElement.dataset.palette = s.palette;
      } catch (e) { /* default light + ocean */ }
    })();
    /* Catch the browser's install offer early; js/pwa.js uses it for the "Install app" button. */
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__bip = e;
      window.dispatchEvent(new Event('fn-installable'));
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <div class="announce" id="announce"></div>
  <header class="site-header" id="header"></header>
  <main id="app" tabindex="-1">
    <noscript><div class="container"><p style="padding:60px 0">FreshNest needs JavaScript to run. Please enable it and reload.</p></div></noscript>
  </main>
  <footer class="site-footer" id="footer"></footer>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Quick navigation"></nav>
  <div class="drawer" id="cart-drawer" aria-hidden="true"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <button type="button" class="to-top" id="to-top" data-action="to-top" aria-label="Back to top">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
  </button>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views-shop.js"></script>
  <script src="js/views-cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
